name: backend-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: mvn -B -f apps/qiyuan-backend/pom.xml -DskipTests package
