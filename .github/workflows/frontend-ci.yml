name: frontend-ci

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/admin-web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/admin-web/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/admin-web/package-lock.json
      - name: Install and build
        run: npm ci && npm run build:prod
